server:
  port: 8080
  error:
    # 에러 발생 시 메시지를 포함하지 않음
    include-message: never
    # 스택트레이스(에러 경로)를 절대 노출하지 않음
    include-stacktrace: never
    # 에러 발생 시 바인딩 오류(파라미터 등) 노출 방지
    include-binding-errors: never
    # 에러 페이지 자체를 화이트라벨(기본) 페이지로 유지하거나 끔
    whitelabel:
      enabled: false
spring:
  application:
    name: highlight
  datasource:
    # Render 환경변수에서 값을 가져오고, 없으면 로컬 DB 주소를 씁니다.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/highlight}
    username: ${SPRING_DATASOURCE_USERNAME:highlight}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        # JDBC / Hibernate batching for bulk inserts
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        # generate_statistics=true enables Hibernate Statistics API (used for diagnostics)
        generate_statistics: true
        # reduce session memory pressure when inserting large volumes
        default_batch_fetch_size: 50
            
  flyway:
    enabled: true
    # 기존 데이터가 있는 상태에서 Flyway를 처음 적용할 때 필요합니다.
    baseline-on-migrate: true
    # 배포 환경에서 마이그레이션 위치 확인
    locations: classpath:db/migration

  docker:
    compose:
      enabled: false

chzzk:
  base-url: https://api.chzzk.naver.com
  max-in-memory-size: 10485760 # 10MB

gemini:
  # Render 환경변수에 GEMINI_API_KEY를 꼭 추가하세요!
  api-key: ${GEMINI_API_KEY:1234}

admin:
  # 관리자 JWT 설정 (운영에서는 반드시 ADMIN_JWT_SECRET 환경변수로 32바이트 이상 랜덤값 지정)
  jwt:
    secret: ${ADMIN_JWT_SECRET:change-me-please-use-a-long-random-secret-key-32bytes+}
    expiration-ms: ${ADMIN_JWT_EXPIRATION_MS:43200000} # 12시간
  # 최초 관리자 계정 부트스트랩 (없을 때만 생성). ADMIN_USERNAME/ADMIN_PASSWORD 환경변수 사용
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
  # 파일 로깅은 LOGGING_FILE_NAME 환경변수를 준 곳에서만 켜진다(운영 compose).
  # 여기서 경로를 지정하지 않으므로 로컬 개발은 콘솔 출력 그대로다.
  # 아래 정책은 파일 로깅이 켜졌을 때만 의미가 있다.
  logback:
    rollingpolicy:
      # 10MB 마다 하루 단위로 말아 두고, 14일 / 총 500MB 를 넘지 않게 유지한다
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
